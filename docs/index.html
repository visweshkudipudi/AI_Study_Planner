<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Adaptive Study Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <h1>📚 AI Study Planner</h1>
      <span id="api-status" class="badge">Connecting...</span>
    </div>
  </header>

  <main class="wrap">
    <!-- Student Profile Loader -->
    <section class="card">
      <h2>1. Your Study Profile</h2>
      <div class="row">
        <input id="user-id" type="text" placeholder="Enter your username (e.g. viswesh)" />
        <button class="btn-secondary" onclick="loadSavedPlan()">Load Plan</button>
      </div>
    </section>

    <!-- AI Plan Generator Form -->
    <section class="card">
      <h2>2. Generate Adaptive Plan</h2>
      <form id="plan-form" onsubmit="generatePlan(event)">
        <label>Subjects (comma-separated)</label>
        <input id="subjects" type="text" placeholder="C Programming, Matrices, Physics, BEEE" required />

        <div class="grid-2">
          <div>
            <label>Days Until Exam</label>
            <input id="days" type="number" min="1" max="30" value="7" required />
          </div>
          <div>
            <label>Hours / Day</label>
            <input id="hours" type="number" min="1" max="14" step="0.5" value="3" required />
          </div>
        </div>

        <label>Weak Topics (optional)</label>
        <input id="weak-topics" type="text" placeholder="e.g. Pointers, Eigenvalues, Wave Optics" />

        <button type="submit" id="gen-btn" class="btn-primary">✨ Generate AI Schedule</button>
      </form>
    </section>

    <!-- Focus Timer -->
    <section class="card timer-card">
      <div>
        <h2>⏱️ Focus Timer</h2>
        <p id="timer-display" class="timer-num">25:00</p>
      </div>
      <div class="timer-btns">
        <button class="btn-primary" onclick="startTimer()">Start</button>
        <button class="btn-secondary" onclick="pauseTimer()">Pause</button>
        <button class="btn-secondary" onclick="resetTimer()">Reset</button>
      </div>
    </section>

    <!-- Generated Schedule Output -->
    <section id="plan-section" class="card hidden">
      <div class="plan-head">
        <div>
          <h2>🗓️ Your Study Schedule</h2>
          <p id="plan-summary" class="muted"></p>
        </div>
        <strong id="progress-text">0%</strong>
      </div>
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <div id="days-container"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
